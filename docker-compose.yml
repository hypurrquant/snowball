services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: snowball-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3001}:3001"
    volumes:
      - server-data:/app/apps/server/data
    environment:
      - PORT=3001
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # frontend:
