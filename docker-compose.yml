  #     - "${FRONTEND_PORT:-3000}:3000"
  #   depends_on:
  #     server:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
  #     interval: 30s
